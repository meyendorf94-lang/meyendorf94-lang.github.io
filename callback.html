<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geni Callback</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #fffdf8;
      color: #222;
      display: grid;
      min-height: 100vh;
      place-items: center;
    }
    main {
      max-width: 760px;
      padding: 32px 20px;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f4efe6;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Geni Authorization Callback</h1>
    <p>This page captures the token returned by Geni after authorization.</p>
    <pre id="out">Waiting for authorization response...</pre>
    <script>
      const out = document.getElementById("out");
      const hash = window.location.hash.startsWith("#")
        ? window.location.hash.slice(1)
        : "";
      const params = new URLSearchParams(hash);
      const accessToken = params.get("access_token");
      const expiresIn = params.get("expires_in");
      const status = params.get("status");
      const message = params.get("message");

      if (accessToken) {
        out.textContent =
          "access_token: " + accessToken + "\n" +
          "expires_in: " + (expiresIn || "unknown");
      } else if (status || message) {
        out.textContent =
          "status: " + (status || "") + "\n" +
          "message: " + (message || "");
      } else {
        out.textContent = window.location.href;
      }
    </script>
  </main>
</body>
</html>
